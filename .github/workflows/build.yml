name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --org com.example --project-name mychat app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          cp google-services.json app/google-services.json
          cp icon.png app/icon.png
          cp icon_fg.png app/icon_fg.png || true

      - name: Generate Firebase options from google-services.json
        working-directory: app
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('google-services.json'))
          client = d['client'][0]
          opts = {
              'apiKey': client['api_key'][0]['current_key'],
              'appId': client['client_info']['mobilesdk_app_id'],
              'messagingSenderId': d['project_info']['project_number'],
              'projectId': d['project_info']['project_id'],
          }
          code = "import 'package:firebase_core/firebase_core.dart';\n\n"
          code += "const firebaseOptions = FirebaseOptions(\n"
          for k, v in opts.items():
              code += "  %s: '%s',\n" % (k, v)
          code += ");\n"
          open('lib/firebase_options.dart', 'w').write(code)
          EOF

      - name: Patch Android settings
        working-directory: app
        run: |
          APP_NAME=$(grep -oP "kAppName = '\K[^']+" lib/main.dart || echo "Alap")
          echo "App name: $APP_NAME"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>\n    <application#' $MANIFEST
          sed -i "s#android:label=\"[^\"]*\"#android:label=\"$APP_NAME\"#" $MANIFEST
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true

      - name: Set app icon
        working-directory: app
        run: |
          flutter pub add dev:flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
          EOF
          if [ -f icon_fg.png ]; then
          cat >> flutter_launcher_icons.yaml <<'EOF'
            adaptive_icon_background: "#0A7A66"
            adaptive_icon_foreground: "icon_fg.png"
          EOF
          fi
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alap build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
