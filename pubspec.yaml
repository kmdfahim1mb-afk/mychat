name: mychat
description: Simple chat app
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: '>=3.6.0'
  firebase_auth: '>=5.3.0'
  cloud_firestore: '>=5.4.0'
  record: '>=5.1.0'
  audioplayers: '>=6.0.0'
  path_provider: '>=2.1.0'
  image_picker: '>=1.0.0'
  file_selector: '>=1.0.0'
  open_filex: '>=4.5.0'
  shared_preferences: '>=2.2.0'

flutter:
  uses-material-design: true
  assets:
    - icon.png
